<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You | EduPulse</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: #f2f6f2;
        }

        .thank-you-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px #00000015;
            max-width: 420px;
            margin: 20px;
        }

        h1 {
            color: #35633e;
        }

        p {
            color: #555;
            line-height: 1.6;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 24px;
            background: #35633e;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        a:hover {
            background: #264b2e;
        }
    </style>
</head>
<body>
    <div class="thank-you-card">
        <h1>Thank You!</h1>
        <p>Your feedback has been submitted successfully.</p>
        <p>Your feedback helps us improve the quality of education.</p>
        <a href="{{ url_for('index') }}">Back to Home</a>
    </div>
</body>
</html>
